<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out of tokens — Panel Designer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:40px 32px;width:100%;max-width:420px;text-align:center}
.icon{font-size:48px;margin-bottom:20px}
h2{font-size:22px;font-weight:700;margin-bottom:10px;color:#e6edf3}
p{color:#8b949e;font-size:14px;line-height:1.6;margin-bottom:24px}
.token-info{background:#0d2137;border:1px solid #388bfd33;border-radius:8px;padding:14px;margin-bottom:24px;font-size:13px;color:#8b949e}
.token-info b{color:#388bfd;font-size:15px}
.btn{display:inline-block;padding:11px 24px;background:#238636;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .2s}
.btn:hover{background:#2ea043}
.btn-ghost{background:transparent;color:#8b949e;border:1px solid #30363d;margin-left:10px}
.btn-ghost:hover{color:#e6edf3;border-color:#6e7681}
.formula{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;font-size:12px;color:#6e7681;margin-top:20px;text-align:left}
.formula b{color:#e6edf3}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🪫</div>
  <h2>Out of tokens</h2>
  <p>You have used all your tokens. Please contact the administrator to top up your balance.</p>
  <div class="token-info">
    Your current balance: <b id="tokens-left">0</b> tokens
  </div>
  <a href="/" class="btn">← Back to app</a>
  <a href="/login" class="btn btn-ghost" onclick="doLogout(event)">Sign out</a>
  <div class="formula">
    <b>Token cost per analysis:</b><br>
    Base: 1,000 tokens<br>
    Per device detected: 250 tokens<br>
    Example: 10 devices = 1,000 + 10×250 = <b>3,500 tokens</b>
  </div>
</div>
<script>
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(d.ok) document.getElementById('tokens-left').textContent = d.tokens.toLocaleString();
});
async function doLogout(e) {
  e.preventDefault();
  await fetch('/api/auth/logout', {method:'POST'});
  window.location.href = '/login';
}
</script>
</body>
</html>
