<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Panel Designer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px;width:100%;max-width:380px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#238636,#1a7f37);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:18px;font-weight:700;color:#e6edf3}
h2{font-size:20px;font-weight:600;margin-bottom:20px;text-align:center;color:#e6edf3}
.field{margin-bottom:16px}
label{display:block;font-size:13px;color:#8b949e;margin-bottom:6px}
input{width:100%;padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;outline:none;transition:border-color .2s}
input:focus{border-color:#388bfd}
.btn{width:100%;padding:11px;background:#238636;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:8px}
.btn:hover{background:#2ea043}
.btn:disabled{background:#21262d;color:#6e7681;cursor:not-allowed}
.link-row{text-align:center;margin-top:16px;font-size:13px;color:#8b949e}
.link-row a{color:#388bfd;text-decoration:none}
.link-row a:hover{text-decoration:underline}
.error{background:#3d1f1f;border:1px solid #f85149;border-radius:8px;padding:10px 12px;font-size:13px;color:#f85149;margin-bottom:16px;display:none}
.token-info{background:#0d2137;border:1px solid #388bfd33;border-radius:8px;padding:10px 12px;font-size:12px;color:#8b949e;text-align:center;margin-bottom:20px}
.token-info b{color:#388bfd}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">PanelDesigner</div>
  </div>
  <h2>Sign in</h2>
  <div class="token-info">New accounts receive <b>1,000,000 tokens</b> free</div>
  <div class="error" id="err"></div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="btn" onclick="doLogin()">Sign in</button>
  <div class="link-row">Don't have an account? <a href="/register">Register</a></div>
</div>
<script>
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
async function doLogin() {
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  err.style.display = 'none';
  if (!email || !password) { showErr('Please enter email and password'); return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const d = await r.json();
    if (d.ok) { window.location.href = '/'; }
    else { showErr(d.error || 'Login failed'); btn.disabled=false; btn.textContent='Sign in'; }
  } catch(e) { showErr('Connection error'); btn.disabled=false; btn.textContent='Sign in'; }
}
function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg; el.style.display = 'block';
}
</script>
</body>
</html>
